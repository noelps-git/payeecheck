<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayeeCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:    #FFFFFF;
  --bg:       #F9FAFB;
  --border:   #E5E7EB;
  --border2:  #D1D5DB;
  --text:     #111827;
  --text2:    #6B7280;
  --text3:    #9CA3AF;
  --blue:     #2563EB;
  --blue-bg:  #EFF6FF;
  --red:      #DC2626;
  --red-bg:   #FEF2F2;
  --red-pill: #FEE2E2;
  --amber:    #D97706;
  --amber-bg: #FFFBEB;
  --amber-pill:#FEF3C7;
  --green:    #059669;
  --green-bg: #ECFDF5;
  --green-pill:#D1FAE5;
  --purple:   #7C3AED;
  --purple-bg:#F5F3FF;
  --gray-pill: #F3F4F6;
  --sans: 'Inter',system-ui,-apple-system,sans-serif;
  --mono: 'SF Mono','Fira Code','Courier New',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--sans);font-size:13px;line-height:1.5;
  color:var(--text);display:flex}

/* ── SIDEBAR ──────────────────────────────────────────────────── */
#sidebar{
  width:220px;min-width:220px;background:var(--white);
  border-right:1px solid var(--border);display:flex;
  flex-direction:column;overflow:hidden;flex-shrink:0
}
.sb-logo{
  display:flex;align-items:center;gap:10px;
  padding:16px 16px 14px;border-bottom:1px solid var(--border)
}
.sb-logo-mark{
  width:28px;height:28px;background:#111827;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;flex-shrink:0
}
.sb-logo-name{font-size:13.5px;font-weight:600;color:var(--text)}
.sb-logo-env{font-size:10px;color:var(--text3)}

.sb-section{
  font-size:10.5px;font-weight:600;color:var(--text3);
  letter-spacing:.07em;text-transform:uppercase;
  padding:16px 14px 6px
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 14px;cursor:pointer;color:var(--text2);
  font-size:13px;font-weight:500;border-radius:0;
  transition:all .1s;border-left:2px solid transparent;
  margin:1px 0
}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{
  background:var(--bg);color:var(--blue);
  border-left-color:var(--blue);font-weight:600
}
.nav-icon{
  width:15px;height:15px;flex-shrink:0;opacity:.6
}
.nav-item.active .nav-icon{opacity:1}
.nav-count{
  margin-left:auto;font-size:10px;padding:1px 6px;
  border-radius:10px;background:var(--gray-pill);
  color:var(--text2);font-weight:500
}
.nav-item.active .nav-count{background:var(--blue-bg);color:var(--blue)}

.sb-bottom{
  margin-top:auto;padding:12px 14px;
  border-top:1px solid var(--border)
}
.api-row{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text3)
}
.api-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);flex-shrink:0
}
.api-dot.off{background:var(--red)}

/* ── MAIN ─────────────────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── TOPBAR ───────────────────────────────────────────────────── */
.topbar{
  height:52px;min-height:52px;background:var(--white);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 24px;gap:8px
}
.tb-breadcrumb{font-size:12px;color:var(--text3)}
.tb-sep{color:var(--border2)}
.tb-title{font-size:14px;font-weight:600;color:var(--text)}
.tb-risk-badge{
  font-size:11px;font-weight:600;padding:2px 10px;
  border-radius:4px;margin-left:8px
}
.risk-very-high{background:var(--red-pill);color:var(--red)}
.risk-high{background:var(--amber-pill);color:var(--amber)}
.risk-medium{background:var(--amber-pill);color:var(--amber)}
.risk-low{background:var(--green-pill);color:var(--green)}
.risk-clear{background:var(--green-pill);color:var(--green)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-btn{
  font-size:12px;font-weight:500;padding:5px 14px;
  border-radius:6px;cursor:pointer;border:1px solid var(--border2);
  background:var(--white);color:var(--text);transition:all .1s;
  font-family:var(--sans)
}
.tb-btn:hover{background:var(--bg);border-color:var(--border2)}
.tb-btn-primary{
  background:var(--red);color:var(--white);border-color:var(--red)
}
.tb-btn-primary:hover{background:#B91C1C;border-color:#B91C1C}
.tb-btn-allow{
  background:var(--green);color:var(--white);border-color:var(--green)
}
.tb-btn-allow:hover{background:#047857}

/* ── TWO COLUMN LAYOUT ────────────────────────────────────────── */
#workspace{flex:1;display:flex;overflow:hidden}

/* Left: alert list */
#alert-list-panel{
  width:340px;min-width:340px;background:var(--white);
  border-right:1px solid var(--border);display:flex;
  flex-direction:column;overflow:hidden
}
.alp-head{
  padding:14px 16px 0;flex-shrink:0
}
.alp-title{
  font-size:11px;font-weight:600;color:var(--text3);
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px
}
.alp-tabs{
  display:flex;border-bottom:1px solid var(--border);
  margin:0 -16px;padding:0 16px
}
.atab{
  font-size:12.5px;color:var(--text2);padding:7px 10px;
  cursor:pointer;border-bottom:2px solid transparent;
  transition:all .1s;white-space:nowrap;font-weight:500
}
.atab:hover{color:var(--text)}
.atab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.alp-search{
  padding:10px 16px;border-bottom:1px solid var(--border)
}
.search-input{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:6px 10px;font-size:12.5px;
  color:var(--text);outline:none;font-family:var(--sans)
}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--blue-bg);
  box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.alert-list{flex:1;overflow-y:auto}
.alert-list::-webkit-scrollbar{width:4px}
.alert-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.alert-row{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .08s
}
.alert-row:hover{background:var(--bg)}
.alert-row.active{background:var(--blue-bg)}
.ar-icon{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;margin-top:1px
}
.ar-body{flex:1;min-width:0}
.ar-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.ar-name{font-size:12.5px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-time{font-size:10.5px;color:var(--text3);margin-left:auto;white-space:nowrap}
.ar-sub{font-size:11.5px;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.ar-tag{
  font-size:10px;padding:1px 7px;border-radius:10px;
  font-weight:500
}
.ar-agent{
  font-size:10.5px;color:var(--purple);margin-top:4px;
  display:flex;align-items:center;gap:4px
}

/* Right: case detail */
#case-detail{flex:1;overflow-y:auto;background:var(--bg);min-width:0}
#case-detail::-webkit-scrollbar{width:5px}
#case-detail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#case-content{padding:24px}

/* Empty state */
.empty{
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  color:var(--text3)
}
.empty svg{width:40px;height:40px;opacity:.3}

/* ── CASE SECTIONS ────────────────────────────────────────────── */
.case-header{
  background:var(--white);border:1px solid var(--border);
  border-radius:8px;padding:16px 18px;margin-bottom:16px
}
.ch-top{display:flex;align-items:flex-start;gap:16px}
.ch-score{
  display:flex;flex-direction:column;align-items:center;
  background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:12px 16px;min-width:80px;flex-shrink:0
}
.ch-score-num{
  font-size:32px;font-weight:700;line-height:1;
  font-family:var(--mono)
}
.ch-score-lbl{
  font-size:9.5px;color:var(--text3);margin-top:2px;
  text-transform:uppercase;letter-spacing:.07em;font-weight:600
}
.ch-info{flex:1}
.ch-name{font-size:16px;font-weight:600;color:var(--text);margin-bottom:2px}
.ch-vpa{
  font-size:12.5px;font-family:var(--mono);color:var(--text2);
  margin-bottom:8px
}
.ch-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  font-size:11px;padding:2px 10px;border-radius:10px;
  font-weight:500;border:1px solid
}
.pill-block{background:var(--red-pill);color:var(--red);border-color:#FECACA}
.pill-warn{background:var(--amber-pill);color:var(--amber);border-color:#FDE68A}
.pill-pass{background:var(--green-pill);color:var(--green);border-color:#A7F3D0}
.pill-neutral{background:var(--gray-pill);color:var(--text2);border-color:var(--border)}
.pill-blue{background:var(--blue-bg);color:var(--blue);border-color:#BFDBFE}
.pill-purple{background:var(--purple-bg);color:var(--purple);border-color:#DDD6FE}
.ch-meta{
  display:flex;gap:20px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border);flex-wrap:wrap
}
.ch-meta-item{font-size:11.5px}
.ch-meta-label{color:var(--text3);margin-bottom:1px}
.ch-meta-val{font-weight:600;color:var(--text)}

/* Section card */
.sec-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:8px;margin-bottom:12px;overflow:hidden
}
.sec-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;transition:background .08s
}
.sec-head:hover{background:var(--bg)}
.sec-title{font-size:12px;font-weight:600;color:var(--text)}
.sec-count{
  font-size:11px;color:var(--text3);display:flex;
  align-items:center;gap:6px
}
.sec-chev{
  font-size:10px;color:var(--text3);transition:transform .2s
}
.sec-card.open .sec-chev{transform:rotate(180deg)}
.sec-body{display:none;overflow:hidden}
.sec-card.open .sec-body{display:block}

/* Signal rows */
.sig-row{
  display:grid;
  grid-template-columns:1fr 80px 70px;
  align-items:center;gap:12px;
  padding:9px 16px;border-bottom:1px solid var(--border)
}
.sig-row:last-child{border-bottom:none}
.sig-row:hover{background:var(--bg)}
.sig-name{font-size:12.5px;color:var(--text);font-weight:500}
.sig-detail{font-size:11px;color:var(--text2);margin-top:1px}
.sig-fleet{text-align:right}
.sig-fleet-num{font-size:11px;color:var(--text2);display:block}
.sig-fleet-bar{
  width:100%;height:3px;background:var(--border);
  border-radius:2px;margin-top:3px;overflow:hidden
}
.sig-fleet-fill{height:100%;border-radius:2px}
.sev-pill{
  font-size:10px;font-weight:600;padding:2px 8px;
  border-radius:4px;text-align:center;white-space:nowrap
}
.sev-critical{background:var(--red-pill);color:var(--red)}
.sev-high{background:var(--amber-pill);color:var(--amber)}
.sev-medium{background:#FEF3C7;color:#92400E}
.sev-low{background:var(--blue-bg);color:var(--blue)}
.sev-info{background:var(--green-pill);color:var(--green)}

/* Device table */
.device-table{width:100%;border-collapse:collapse}
.device-table td{
  padding:8px 16px;border-bottom:1px solid var(--border);
  font-size:12.5px;vertical-align:middle
}
.device-table tr:last-child td{border-bottom:none}
.device-table tr:hover td{background:var(--bg)}
.dt-label{color:var(--text2);width:180px;font-weight:500}
.dt-val{color:var(--text);font-weight:500}
.dt-risk{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}

/* Attribution */
.attr-table{width:100%;border-collapse:collapse}
.attr-table td{
  padding:8px 16px;border-bottom:1px solid var(--border);
  font-size:12px;vertical-align:middle
}
.attr-table tr:last-child td{border-bottom:none}
.attr-table tr:hover td{background:var(--bg)}
.attr-signal{color:var(--text2);font-family:var(--mono);font-size:11px;width:160px}
.attr-assertion{color:var(--text)}
.attr-val{color:var(--blue);font-family:var(--mono);font-size:11px;
  font-weight:600;white-space:nowrap;width:80px;text-align:right}
.layer-label{
  padding:7px 16px;background:var(--bg);
  font-size:10.5px;font-weight:600;color:var(--text3);
  letter-spacing:.06em;text-transform:uppercase;
  border-bottom:1px solid var(--border)
}

/* Timeline */
.tl-row{
  display:flex;gap:14px;padding:10px 16px;
  border-bottom:1px solid var(--border)
}
.tl-row:last-child{border-bottom:none}
.tl-row:hover{background:var(--bg)}
.tl-left{
  display:flex;flex-direction:column;align-items:center;
  width:12px;flex-shrink:0;margin-top:5px
}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:2px solid}
.tl-spine{width:1px;background:var(--border);flex:1;margin:2px 0;min-height:12px;display:none}
.tl-row:not(:last-child) .tl-spine{display:block}
.tl-time{font-size:10.5px;color:var(--text3);font-family:var(--mono);width:64px;flex-shrink:0;margin-top:2px}
.tl-body{flex:1}
.tl-event{font-size:12.5px;font-weight:500;color:var(--text)}
.tl-detail{font-size:11.5px;color:var(--text2);margin-top:1px}

/* Connection graph */
.graph-area{padding:0;background:var(--white)}
#g-svg{width:100%;height:200px;display:block}

/* Agent cards */
.agent-card{
  padding:14px 16px;border-bottom:1px solid var(--border)
}
.agent-card:last-child{border-bottom:none}
.agent-card:hover{background:var(--bg)}
.agent-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.agent-name{font-size:12.5px;font-weight:600;color:var(--text)}
.agent-status-pill{
  font-size:10px;padding:1px 8px;border-radius:10px;font-weight:600
}
.agen-active{background:var(--purple-bg);color:var(--purple)}
.agen-sched{background:var(--blue-bg);color:var(--blue)}
.agent-desc{font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:8px}
.agent-governance{
  font-size:11px;color:var(--text3);margin-bottom:8px;
  padding:6px 10px;background:var(--bg);border-radius:5px;
  border-left:2px solid var(--border2)
}
.agent-run-btn{
  font-size:11.5px;font-weight:500;padding:5px 14px;
  border-radius:5px;cursor:pointer;border:1px solid var(--border2);
  background:var(--white);color:var(--blue);font-family:var(--sans);
  transition:all .1s
}
.agent-run-btn:hover{background:var(--blue-bg);border-color:var(--blue)}
.agent-run-btn:disabled{opacity:.5;cursor:not-allowed}
.agent-output{
  margin-top:8px;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:10px 12px;font-family:var(--mono);
  font-size:11px;color:var(--text2);line-height:1.65;
  white-space:pre-wrap;display:none;max-height:220px;overflow-y:auto
}
.agent-output.on{display:block}

/* Spinner */
.spinner{
  width:11px;height:11px;border:2px solid var(--border);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin .5s linear infinite;display:inline-block;
  vertical-align:middle;margin-right:5px
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SIGNALS VIEW ─────────────────────────────────────────────── */
#view-signals{
  display:none;flex:1;background:var(--bg);overflow-y:auto
}
.view-inner{padding:24px;max-width:900px}
.view-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:4px}
.view-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.mod-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:8px;margin-bottom:8px;overflow:hidden
}
.mod-head{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  cursor:pointer;transition:background .08s
}
.mod-head:hover{background:var(--bg)}
.mod-name{font-size:13px;font-weight:600;color:var(--text)}
.mod-count{font-size:11px;color:var(--text3);font-family:var(--mono)}
.mod-chev{margin-left:auto;font-size:10px;color:var(--text3);transition:transform .2s}
.mod-card.open .mod-chev{transform:rotate(180deg)}
.mod-body{display:none}
.mod-card.open .mod-body{display:block}
.lv-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:8px 16px;border-bottom:1px solid var(--border)
}
.lv-row:last-child{border-bottom:none}
.lv-row:hover{background:var(--bg)}
.lv-tag{
  font-size:10px;font-family:var(--mono);font-weight:600;
  padding:2px 6px;border-radius:4px;background:var(--bg);
  border:1px solid var(--border);color:var(--text2);
  flex-shrink:0;margin-top:1px;min-width:28px;text-align:center
}
.lv-info{flex:1}
.lv-name{font-size:12.5px;font-weight:500;color:var(--text)}
.lv-desc{font-size:11.5px;color:var(--text2);margin-top:1px}
.st-pill{
  font-size:10px;padding:2px 8px;border-radius:10px;
  font-weight:600;flex-shrink:0;margin-top:2px
}
.st-done{background:var(--green-pill);color:var(--green)}
.st-part{background:var(--amber-pill);color:var(--amber)}
.st-pend{background:var(--blue-bg);color:var(--blue)}

/* ── AGENTS VIEW ──────────────────────────────────────────────── */
#view-agents{
  display:none;flex:1;background:var(--bg);overflow-y:auto
}

/* ── ABOUT VIEW ───────────────────────────────────────────────── */
#view-about{
  display:none;flex:1;background:var(--bg);overflow-y:auto
}
.phase-row{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--border)
}
.phase-row:last-child{border-bottom:none}
.phase-num{
  font-size:11px;font-weight:600;color:var(--text2);
  white-space:nowrap;width:72px;flex-shrink:0;margin-top:2px
}
.phase-body{flex:1}
.phase-title{
  font-size:13px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:8px;margin-bottom:3px
}
.phase-desc{font-size:12px;color:var(--text2);line-height:1.6}
</style>
</head>
<body>

<!-- ══ SIDEBAR ════════════════════════════════════════════════ -->
<div id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-mark">P</div>
    <div>
      <div class="sb-logo-name">PayeeCheck</div>
      <div class="sb-logo-env">Sandbox · v1.0</div>
    </div>
  </div>

  <div class="sb-section">Investigations</div>
  <div class="nav-item active" onclick="nav(this,'queue')">
    <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor">
      <path d="M1 2a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H2a1 1 0 01-1-1V2zm0 5a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H2a1 1 0 01-1-1V7zm0 5a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H2a1 1 0 01-1-1v-2z"/>
    </svg>
    Alert Queue
    <span class="nav-count">13</span>
  </div>
  <div class="nav-item" onclick="nav(this,'signals')">
    <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor">
      <path d="M0 1a1 1 0 012 0v14a1 1 0 01-2 0V1zm4 4a1 1 0 012 0v10a1 1 0 01-2 0V5zm4-2a1 1 0 012 0v12a1 1 0 01-2 0V3zm4 3a1 1 0 012 0v9a1 1 0 01-2 0V6z"/>
    </svg>
    Signal Modules
    <span class="nav-count">6</span>
  </div>

// ── Alert list ─────────────────────────────────────────────────
function renderAlerts() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = ALERTS.filter(a=>{
    const matchF = currentFilter==='all' || a.verdict===currentFilter;
    const matchQ = !q || a.name.toLowerCase().includes(q) || a.vpa.toLowerCase().includes(q);
    return matchF && matchQ;
  });

  const riskColor = {block:'#FEE2E2',warn:'#FEF3C7',pass:'#D1FAE5'};
  const riskText  = {block:'#DC2626',warn:'#D97706',pass:'#059669'};
  const vLabel    = {block:'BLOCK',warn:'REVIEW',pass:'PASS'};

  document.getElementById('alert-list').innerHTML = list.map(a=>`
    <div class="alert-row${currentAlert&&currentAlert.id===a.id?' active':''}"
      onclick="openAlert('${a.id}')">
      <div class="ar-icon" style="background:${riskColor[a.verdict]}">
        <span style="font-size:13px">${a.verdict==='block'?'🚫':a.verdict==='warn'?'⚠️':'✅'}</span>
      </div>
      <div class="ar-body">

          <span class="ar-time">${a.age} ago</span>
        </div>
        <div class="ar-sub">${a.vpa}</div>
        <div class="ar-tags">
          <span class="ar-tag" style="background:${riskColor[a.verdict]};color:${riskText[a.verdict]}">${vLabel[a.verdict]} · ${a.score}</span>
          ${a.tags.map(t=>`<span class="ar-tag" style="background:var(--gray-pill);color:var(--text2)">${t}</span>`).join('')}
        </div>
        ${a.agent?`<div class="ar-agent"><span style="font-size:9px">●</span>${a.agent}</div>`:''}

}

// ── Graph ──────────────────────────────────────────────────────
function drawGraph(a) {
  const svg = document.getElementById('g-svg');
  if(!svg) return;
  const W = svg.clientWidth||700, H=200, cx=W/2, cy=H/2;
  const n = Math.min(a.connections,14);
  const sats = Array.from({length:n},(_,i)=>{
    const angle = (i/n)*Math.PI*2;
    const r = 55 + (i%3)*18;
    return {x:cx+Math.cos(angle)*r, y:cy+Math.sin(angle)*r,
            r:i<3&&a.ringId?6:4,
            color:i<3&&a.ringId?'#DC2626':'#D1D5DB'};
  });
  let out=`<rect width="${W}" height="${H}" fill="var(--bg)"/>`;
  sats.forEach(s=>{
    const isRing = s.color==='#DC2626';
    out+=`<line x1="${cx}" y1="${cy}" x2="${s.x}" y2="${s.y}"
      stroke="${isRing?'#FCA5A5':'#E5E7EB'}" stroke-width="${isRing?1.5:1}"
      ${isRing?'':'stroke-dasharray="3,3"'}/>`;
  });
  sats.forEach(s=>{
    out+=`<circle cx="${s.x}" cy="${s.y}" r="${s.r}" fill="${s.color}" opacity=".85"/>`;
  });
  const cColor = a.verdict==='block'?'#DC2626':a.verdict==='warn'?'#D97706':'#059669';
  out+=`<circle cx="${cx}" cy="${cy}" r="12" fill="${cColor}" opacity=".15"/>`;
  out+=`<circle cx="${cx}" cy="${cy}" r="8" fill="${cColor}"/>`;
  out+=`<text x="${cx}" y="${cy+22}" font-size="9" fill="var(--text2)" text-anchor="middle" font-family="sans-serif">${a.vpa.split('@')[0].substring(0,16)}</text>`;
  svg.innerHTML=out;
}

// ── Agent runner ───────────────────────────────────────────────
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function stream(el, lines) {
  el.textContent='';
  el.classList.add('on');
  for(const line of lines) {
    for(const ch of line+'\n') {
      el.textContent += ch;
      el.scrollTop = el.scrollHeight;
      await sleep(ch==='\n'?20:8);
    }
  }
}
async function streamStr(el, text) {
  el.textContent='';
  el.classList.add('on');
  for(const ch of text) {
    el.textContent += ch;
    el.scrollTop = el.scrollHeight;
    await sleep(ch==='\n'?15:5);
  }
}
async function runAgent(aid, alertId, btn) {
  const a = ALERTS.find(x=>x.id===alertId);
  const ag = AGENTS.find(x=>x.id===aid);
  if(!a||!ag||!ag.fn) return;
  const out = document.getElementById(`out-${aid}-${alertId}`);
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>Running...';
  await ag.fn(a,out);
  btn.disabled=false;
  btn.textContent='Re-run →';
}

// ── Animate count ──────────────────────────────────────────────
function animCount(id,target,ms){
  const el=document.getElementById(id);
  if(!el) return;
  const t0=performance.now();
  (function step(now){
    const p=Math.min((now-t0)/ms,1);
    const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(e*target);
    if(p<1) requestAnimationFrame(step);
  })(t0);
}

// ── API health ─────────────────────────────────────────────────
async function checkApi(){
  try{
    const r=await fetch('/health');
    document.getElementById('api-dot').className='api-dot'+(r.ok?'':' off');
    document.getElementById('api-txt').textContent=r.ok?'API online':'API offline';
  }catch{
    document.getElementById('api-dot').className='api-dot off';
    document.getElementById('api-txt').textContent='API offline';
  }
}
